name: Collect and publish

# Every day: collect the latest coverage, append it to the Parquet archive,
# rebuild the HTML report and publish it with the web dashboard on GitHub Pages
# (docs/). Outlet RSS feeds only hold a few days of items, so a daily run keeps
# more of them. The dashboard data (web/data.json) is exported locally, where
# the sentiment model and the LLM brief run, and copied as committed.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - name: Collect coverage
        run: pr-radar -v collect
      - name: Build report and site
        run: |
          mkdir -p docs
          cp -r web/. docs/
          pr-radar report --publish docs/report.html
      - name: Commit archive and site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/archive docs
          git diff --cached --quiet || git commit -m "Daily collection $(date -u +%F)"
          git push
