# Topic taxonomy. Keywords are case-insensitive prefixes matched at word starts,
# so "sustainab" matches "sustainable" and "sustainability".
topics:
  launch: [launch, unveil, introduc, debut, "lanza", "lança", "lancia", "lance", "stellt vor",
           "tanıt", "piyasaya", "wprowadza", "nowość", "lanserar", "発売"]
  deals_pricing: [deal, discount, sale, "black friday", "cyber monday", "prime day", "% off",
                  rabatt, angebot, descuento, oferta, soldes, promo, sconto, indirim, fiyat,
                  promocja, "rea ", セール]
  reviews: [review, tested, "i tried", "worth it", "test", "probado", reseña, avis, recensione,
            inceleme, denedim, recenzja, recension, レビュー]
  gift_guides: [gift, geschenk, regalo, cadeau, hediye, prezent, julklapp, ギフト]
  skin_science: [clinical, study, dermatolog, collagen, "red light", "led ", microcurrent,
                 wrinkle, acne, "anti-aging", "anti-ageing", hautarzt, cilt, skóra]
  sustainability: [sustainab, eco-friendly, recycl, nachhaltig, sostenib, durable,
                   sürdürülebilir, zrównoważ, hållbar]
  business: [funding, acquisition, acquire, revenue, partnership, partners, expands, expansion,
             investment, retail, "ceo", ipo, layoff, umsatz, ingresos, yatırım, przychod]
  # Reputational risk. Checked by keyword on purpose: the sentiment model sees too few
  # negative news headlines to be trusted for this (it scored a product recall as mildly positive).
  risk: [recall, lawsuit, sued, "class action", injur, burn, "safety warning", "fda warning",
         investigation, scandal, backlash, boycott, rückruf, klage, retirada, demanda, richiamo,
         rappel, "geri çağır", dava, wycof, pozew, återkall, リコール]
  awards: [award, winner, "best of", auszeichnung, premio, prix, ödül, nagroda]
